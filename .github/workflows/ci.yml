name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint.sh

  sandbox:
    name: sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/test-sandbox.sh
        env:
          # Read access to private skill repos in config/pi-packages.txt.
          # Falls back to this repo's token when the secret isn't set.
          GITHUB_TOKEN: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
