# Skills every developer gets. One line per skill under `apm:`.
#
#   Add a skill:     add a line, then run ./setup.sh
#   Remove a skill:  delete the line, then run ./setup.sh
#
# Line formats:
#   - owner/repo                         every skill in a GitHub repo
#   - owner/repo/path/to/skill           one skill from a repo
#   - owner/repo/path/to/skill#v1.2.0    pinned to a tag or commit (recommended)
#   - ./skills/my-skill                  a skill written in this repo (skills/)
#
# After changing this file, commit it together with apm.lock.yaml.

name: agent-kit
version: 0.1.0
targets: [agent-skills]
dependencies:
  apm:
    # - your-org/agent-skills/skills/code-review#v1.0.0
